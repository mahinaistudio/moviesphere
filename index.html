/* -- LANDING PAGE: Ticket (sign-in button) -- */
#lp-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#lp-tint{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:1}
#lp-content{position:fixed;inset:0;z-index:10}
#lp-ticket{position:fixed;top:clamp(16px,1.5vh,30px);right:clamp(30px,2.8vw,56px);width:clamp(110px,9.4vw,170px);mix-blend-mode:screen;transform:rotate(-13deg) translateY(0) scale(1);opacity:0;animation:lpTicketIn .9s ease-out .5s forwards;user-select:none;z-index:20;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));cursor:pointer;transition:transform .35s cubic-bezier(.4,0,.2,1),filter .35s cubic-bezier(.4,0,.2,1);will-change:transform,filter;transform-style:preserve-3d;-webkit-tap-highlight-color:transparent;outline:none}
#lp-ticket.ready:hover{transform:rotate(-13deg) scale(1.08) translateZ(30px);filter:drop-shadow(0 24px 48px rgba(0,0,0,.7)) drop-shadow(0 0 46px rgba(255,220,120,.62)) drop-shadow(0 0 18px rgba(255,245,190,.42))}
#lp-ticket.touch-glow{transform:rotate(-13deg) scale(1.08) translateZ(30px);filter:drop-shadow(0 24px 48px rgba(0,0,0,.7)) drop-shadow(0 0 46px rgba(255,220,120,.62)) drop-shadow(0 0 18px rgba(255,245,190,.42))}
@media(hover:none){#lp-ticket.ready:hover{transform:rotate(-13deg) translateY(0) scale(1);filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}}
@keyframes lpTicketIn{from{opacity:0;transform:rotate(-13deg) translateY(-12px)}to{opacity:1;transform:rotate(-13deg) translateY(0)}}

/* -- LANDING PAGE: Logo (top-left) -- */
#lp-logo{position:fixed;top:clamp(24px,2.8vh,46px);left:clamp(36px,3.1vw,62px);display:flex;align-items:center;gap:clamp(10px,.9vw,16px);color:#fff;text-shadow:0 0 22px rgba(255,255,255,.35),0 0 60px rgba(255,255,255,.12);opacity:0;transform:translateY(-10px);animation:lpFadeDown .9s ease-out .3s forwards;cursor:default;user-select:none}
#lp-logo-gif{width:clamp(40px,3.4vw,60px);height:clamp(40px,3.4vw,60px);flex-shrink:0;object-fit:contain}
#lp-logo .brand{font-family:'Plus Jakarta Sans','Inter',sans-serif;font-size:clamp(1.7rem,2.4vw,2.8rem);line-height:clamp(40px,3.4vw,60px);font-weight:800;letter-spacing:-.035em;display:inline-block;transition:transform 250ms cubic-bezier(.4,0,.2,1)}
#lp-logo .brand:hover{transform:scale(1.02)}
#lp-logo .brand .movie{color:#fff;text-shadow:0 0 4px rgba(139,92,246,.8),0 0 11px rgba(139,92,246,.6),0 0 19px rgba(139,92,246,.4),0 0 40px rgba(139,92,246,.2)}
#lp-logo .brand .sphere{color:#A855F7}
@keyframes lpFadeDown{to{opacity:1;transform:translateY(0)}}

/* -- LANDING PAGE: Social buttons (bottom-left) -- */
#lp-social{position:fixed;bottom:clamp(30px,4vh,54px);left:clamp(36px,3.1vw,62px);display:flex;flex-direction:row;gap:clamp(7px,.6vw,12px);align-items:center}
.lp-social-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.lp-social-wrap::after{content:attr(data-label);position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%) translateY(4px);background:rgba(10,10,10,.82);color:#fff;font-family:'Inter',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.04em;white-space:nowrap;padding:4px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease}
.lp-social-wrap:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}
@media(hover:none){.lp-social-wrap:hover::after{opacity:0}}
.lp-social-btn{width:clamp(32px,2.65vw,50px);height:clamp(32px,2.65vw,50px);border-radius:50%;background:transparent;border:1.5px solid rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s ease,box-shadow .2s ease,transform .2s ease;opacity:0;outline:none}
.lp-social-btn svg{width:clamp(13px,1.1vw,20px);height:clamp(13px,1.1vw,20px);flex-shrink:0;fill:#fff}
.lp-social-btn:hover{border-color:rgba(255,255,255,1);box-shadow:0 0 12px rgba(255,255,255,.4),0 0 24px rgba(255,255,255,.12);transform:translateY(-2px) scale(1.08)}
@media(hover:none){.lp-social-btn:hover{border-color:rgba(255,255,255,.72);box-shadow:none;transform:none}}
.lp-social-wrap.glow .lp-social-btn{border-color:rgba(255,255,255,1);box-shadow:0 0 12px rgba(255,255,255,.4),0 0 24px rgba(255,255,255,.12);transform:translateY(-2px) scale(1.08)}
.lp-social-wrap:nth-child(1) .lp-social-btn{animation:lpFadeLeft .7s ease-out 1s forwards}
.lp-social-wrap:nth-child(2) .lp-social-btn{animation:lpFadeLeft .7s ease-out 1.1s forwards}
.lp-social-wrap:nth-child(3) .lp-social-btn{animation:lpFadeLeft .7s ease-out 1.2s forwards}
.lp-social-wrap:nth-child(4) .lp-social-btn{animation:lpFadeLeft .7s ease-out 1.3s forwards}
@keyframes lpFadeLeft{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}

/* -- LANDING PAGE: Credit (bottom-right) -- */
#lp-credit{position:fixed;bottom:clamp(30px,4vh,54px);right:clamp(38px,3.2vw,62px);display:flex;flex-direction:column;align-items:flex-end;gap:2px;opacity:0;transform:translateY(18px);animation:lpFadeCredit 1.1s ease-out 1.6s forwards,lpFloatCredit 6s ease-in-out 2.8s infinite;cursor:default;user-select:none}
#lp-credit .credit-label{font-family:'Dancing Script','Brush Script MT',cursive;font-size:clamp(.8rem,1.4vw,1.5rem);font-weight:600;color:#FFD369;text-shadow:0 0 14px rgba(255,211,105,.65),0 0 32px rgba(255,211,105,.25);letter-spacing:.03em;line-height:1.2}
#lp-credit .credit-name1{font-family:'Dancing Script','Brush Script MT',cursive;font-size:clamp(1rem,2vw,2rem);font-weight:700;color:#fff;text-align:right;line-height:1.25;text-shadow:0 2px 10px rgba(0,0,0,.7),0 0 28px rgba(255,255,255,.18)}
#lp-credit .credit-name2{font-family:'Dancing Script','Brush Script MT',cursive;font-size:clamp(.85rem,1.7vw,1.7rem);font-weight:600;color:rgba(255,255,255,.9);text-align:right;line-height:1.2;text-shadow:0 2px 10px rgba(0,0,0,.7),0 0 20px rgba(255,255,255,.12)}
@keyframes lpFadeCredit{to{opacity:1;transform:translateY(0)}}
@keyframes lpFloatCredit{0%{transform:translateY(0)}50%{transform:translateY(-5px)}100%{transform:translateY(0)}}

/* -- LANDING PAGE: Hint text -- */
#lp-hint{position:fixed;bottom:clamp(6px,0.8vh,12px);left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;opacity:0;animation:lpFadeCredit 1.1s ease-out 2s forwards,lpBlink 2.5s ease-in-out 3.5s infinite;white-space:nowrap}
#lp-hint .hint-line{width:clamp(40px,7vw,100px);height:2px;background:linear-gradient(90deg,transparent,rgba(139,92,246,0.7),rgba(168,85,247,0.9),rgba(139,92,246,0.7),transparent);box-shadow:0 0 8px rgba(139,92,246,0.5),0 0 16px rgba(139,92,246,0.3)}
#lp-hint .hint-text{font-family:'Inter',sans-serif;font-size:11px;font-weight:500;color:rgba(255,255,255,0.6);letter-spacing:0.03em;white-space:nowrap;text-shadow:0 0 8px rgba(139,92,246,0.5),0 0 16px rgba(139,92,246,0.3)}
@keyframes lpBlink{0%,100%{opacity:1}50%{opacity:0.3}}

/* -- LANDING PAGE: Mobile (=768px) -- */
@keyframes lpFadeCreditMobile{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

  @keyframes lpTicketIn{from{opacity:0;transform:rotate(-13deg) translateY(-10px)}to{opacity:1;transform:rotate(-13deg) translateY(0)}}
  #lp-logo{top:28px;left:16px;gap:8px}
  #lp-logo-gif{width:48px;height:48px}
  #lp-logo .brand{font-size:1.6rem;line-height:1.1;letter-spacing:-.02em;display:flex;flex-direction:column;align-items:flex-start}
  #lp-social{bottom:100px;left:50%;right:auto;transform:translateX(-50%);gap:14px;background:rgba(255,255,255,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:10px 22px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
  .lp-social-btn{width:38px;height:38px;border-color:rgba(255,255,255,.6)}
  .lp-social-btn svg{width:15px;height:15px}

// Storage 
const API = 'https://movie-sphere.team-gaming3436.workers.dev';

async function api(method, path, body) {
  const opts = { method, headers: {} };
  const token = localStorage.getItem('token');
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body != null) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const r = await fetch(API + path, opts);
  if (!r.ok) {
    let e; try { e = await r.json(); } catch { e = { error: r.statusText }; }
    if ((r.status === 401 || r.status === 403) && localStorage.getItem('token')) {
      if (e.error === 'Account not found') throw new Error('ACCOUNT_DELETED');
      throw new Error('SESSION_EXPIRED');
    }
    throw new Error(e.error || 'Request failed');
  }
  return r.json();
}

async function reloadAll() {
  const [items, collections, rules] = await Promise.all([
    api('GET', '/api/items'),
    api('GET', '/api/collections'),
    api('GET', '/api/rules').catch(() => []),
  ]);
  let keys = { tmdb: '', omdb: '' };
  try { keys = await api('GET', '/api/keys'); } catch {}
  state.items = items;
  state.collections = collections;
  state.keys = keys;
  state.rules = rules || [];
  if (state.isAdmin) loadUsers();
  renderPage();
}

function signInWithGoogle() {

function navigate(page, extra={}) {
  if (page === 'detail') detailExpanded = null;
  document.querySelectorAll('.modal-bg').forEach(m => m.remove());
  state.prevPage = state.page;
  Object.assign(state, { page, ...extra });
  const hash = page === 'detail' && extra.detailId ? `#detail/${extra.detailId}` : page === 'collection_detail' && extra.collectionDetailName ? `#collection/${encodeURIComponent(extra.collectionDetailName)}` : `#${page}`;
  history.pushState(null, '', hash);
  closeSidebar();
  render();
  window.scrollTo(0,0);
}

function openSidebar()  { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); if (!document.querySelector('.modal-bg')) document.body.style.overflow = ''; }

// Toast 
let toastTimer;
function toast(msg, type='ok') {
  clearTimeout(toastTimer);
  const h = document.getElementById('toast-host');
  h.innerHTML = `<div class="toast ${type}">${esc(msg)}</div>`;
  toastTimer = setTimeout(() => { h.innerHTML=''; }, 3500);
}

function confirmModal(msg) {
  return new Promise(resolve => {
    const el = document.createElement('div');
    el.className = 'modal-bg';
    el.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()" style="max-width:400px">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px">
        <div style="width:40px;height:40px;border-radius:50%;background:var(--danger-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0">${ic('alertTriangle')}</div>
        <p style="font-size:14px;color:var(--text-secondary);line-height:1.5">${esc(msg)}</p>
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" id="cm-cancel">Cancel</button>
        <button class="btn btn-primary" id="cm-confirm" style="background:var(--danger);box-shadow:0 4px 16px rgba(239,68,68,0.25)">Confirm</button>
      </div>
    </div>`;
    const close = (val) => { el.remove(); resolve(val); };
    el.onclick = () => close(false);
    document.body.appendChild(el);
    document.getElementById('cm-cancel').onclick = () => close(false);
    document.getElementById('cm-confirm').onclick = () => close(true);
  });
}

const _debounceTimers = {};

// -- Custom Dropdown --
let _ddCallbacks = {};
let _ddData = {};
let _ddIdCounter = 0;
// Custom Dropdown
function dropdown(id, options, selected, onChangeFn, data, side, height) {
  const ddId = id + '_' + (++_ddIdCounter);
  _ddCallbacks[ddId] = onChangeFn;
  if (data) _ddData[ddId] = data;
  const rawLabel = options.find(o => o[0] === selected)?.[1] || (typeof STATUSES !== 'undefined' && STATUSES[selected]) || selected.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  const label = (id.startsWith('lib-lang') && selected !== 'all') ? rawLabel.toUpperCase() : rawLabel;
  const dataAttr = data ? Object.entries(data).map(([k,v])=>` data-${k}="${esc(v)}"`).join('') : '';
  const sideClass = side ? ' dropdown-side-' + side : '';
  const hClass = height === 'h42' ? ' dd-h42' : '';
  return `<div class="dropdown${sideClass}${hClass}" id="${ddId}"${dataAttr}>
    <button class="dropdown-btn" onclick="toggleDropdown(event,'${ddId}')">
      <span>${esc(label)}</span>${ic('chevronDown')}
    </button>
    <div class="dropdown-menu">
      ${options.map(([val, lbl]) => { const displayLbl = (id.startsWith('lib-lang') && val !== 'all') ? lbl.toUpperCase() : lbl; return `<button class="dropdown-item${val===selected?' selected':''}" data-dd="${ddId}" data-val="${val}">${esc(displayLbl)}</button>`; }).join('')}
    </div>
  </div>`;
}
function toggleDropdown(e, id) {
  if (e) e.stopPropagation();
  const el = document.getElementById(id);
  if (!el) return;
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
  if (!wasOpen) el.classList.add('open');
}
function closeAllDropdowns() {
  document.querySelectorAll('.dropdown').forEach(dd => {});
  document.querySelectorAll('.dropdown.open').forEach(d => d.classList.remove('open'));
}
document.addEventListener('click', function(e) {
  const item = e.target.closest('.dropdown-item');
  if (item) {
    const ddId = item.getAttribute('data-dd');
    const val = item.getAttribute('data-val');
    const el = document.getElementById(ddId);
    if (el) el.classList.remove('open');
    const cb = _ddCallbacks[ddId];
    if (cb) cb(val, _ddData[ddId] || {}, el);
    return;
  }
  if (!e.target.closest('.dropdown')) closeAllDropdowns();
});

function debounce(key, fn, ms) {
  clearTimeout(_debounceTimers[key]);
  _debounceTimers[key] = setTimeout(fn, ms);
}

// TMDb Import 

function getSuggestions() {
  const items = state.items;
  if (items.length < 2) return [];

  const now = Date.now();
  const freq = {};
  const addWeight = (key, weight) => { freq[key] = (freq[key]||0) + weight; };

  items.forEach(item => {
    const age = now - new Date(item.updatedAt||item.createdAt||0).getTime();
    const recency = Math.max(0.2, 1 - age / (30*24*60*60*1000));
    const ratingBoost = item.rating ? item.rating / 10 : 0.5;
    const w = recency * (0.6 + ratingBoost * 0.4);

    addWeight('type:'+item.type, w);
    (item.genres||[]).forEach(g => addWeight('genre:'+g.toLowerCase(), w));
    if (item.language) addWeight('lang:'+item.language.toLowerCase(), w);
    if (item.country) addWeight('country:'+item.country.toLowerCase(), w);
  });

  const candidates = items.filter(item => {
    if (item.status === 'watching' || item.status === 'completed') return false;
    if (item.progress > 0) return false;
    return true;
  });

  if (candidates.length === 0) return [];

  const scored = candidates.map(item => {
    let score = 0;
    const reasons = [];

    const typeW = freq['type:'+item.type] || 0;
    if (typeW > 0) { score += typeW * 3; reasons.push(TYPES[item.type]?.label || item.type); }

    (item.genres||[]).forEach(g => {
      const w = freq['genre:'+g.toLowerCase()] || 0;
      if (w > 0) { score += w * 2; reasons.push(g); }
    });
    if (item.language) {
      const w = freq['lang:'+item.language.toLowerCase()] || 0;
      if (w > 0) score += w * 1.5;
    }
    if (item.country) {
      const w = freq['country:'+item.country.toLowerCase()] || 0;
      if (w > 0) score += w * 1.5;
    }

    return { item, score, reasons: [...new Set(reasons)].slice(0, 3) };
  });

  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 5);
}

async function changeStatus(id, newStatus) {
  const idx = state.items.findIndex(x => x.id === id);
  if (idx < 0) return;
  const x = state.items[idx];
  const prev = { ...x };
  try {
    if (!x.seasons || !x.seasons.length) {
      state.items[idx] = { ...x, status: newStatus, updatedAt: new Date().toISOString() };
      renderPage();
      await api('PATCH', '/api/items/' + id, { status: newStatus });
      return;
    }
    const newVal = newStatus === 'completed' ? true : (newStatus === 'plan_to_watch' ? false : null);
    if (newVal === null) {
      state.items[idx] = { ...x, status: newStatus, updatedAt: new Date().toISOString() };
      renderPage();
      await api('PATCH', '/api/items/' + id, { status: newStatus });
      return;
    }
    const seasons = x.seasons.map(s => ({
      ...s,
      episodes: s.episodes.map(ep => ({ ...ep, watched: newVal }))
    }));
    const total = seasons.reduce((a,s) => a + s.episodes.length, 0);
    const watched = seasons.reduce((a,s) => a + s.episodes.filter(e => e.watched).length, 0);
    const progress = total > 0 ? Math.round(watched / total * 100) : 0;
    const updated = { ...x, seasons, watchedEpisodes: watched, progress, status: newStatus, updatedAt: new Date().toISOString() };
    state.items[idx] = updated;
    renderPage();
    await api('PATCH', '/api/items/' + id, { seasons, watchedEpisodes: watched, progress, status: newStatus });
  } catch(e) {
    state.items[idx] = prev;
    renderPage();
    toast('Failed to update status: ' + e.message, 'err');
  }
}

async function toggleEp(itemId, si, ei) {
  const idx = state.items.findIndex(x => x.id === itemId);
  if (idx < 0) return;
  const x = state.items[idx];
  const prev = { ...x };
  try {
    const seasons = x.seasons.map((s,i) => {
      if (i !== si) return s;
      return { ...s, episodes: s.episodes.map((ep,j) => j===ei ? {...ep, watched:!ep.watched} : ep) };
    });
    const total   = seasons.reduce((a,s)=>a+s.episodes.length,0);
    const watched = seasons.reduce((a,s)=>a+s.episodes.filter(e=>e.watched).length,0);
    const progress= total>0 ? Math.round(watched/total*100) : x.progress;
    const status = progress >= 100 ? 'completed' : (progress > 0 ? (x.type === 'movie' ? 'plan_to_watch' : 'watching') : 'plan_to_watch');
    const updated = { ...x, seasons, watchedEpisodes:watched, progress, status, updatedAt:new Date().toISOString() };
    const newItems = [...state.items];
    newItems[idx] = updated;
    state.items = newItems;
    renderPage();
    await api('PATCH', '/api/items/' + itemId, { seasons: updated.seasons, watchedEpisodes: watched, progress, status });
  } catch(e) {
    state.items[idx] = prev;
    renderPage();
    toast('Failed to update episode: ' + e.message, 'err');
  }
}

async function toggleSeason(itemId, si) {
  const idx = state.items.findIndex(x => x.id === itemId);
  if (idx < 0) return;
  const x = state.items[idx];
  const prev = { ...x };
  try {
    const s = x.seasons[si];
    const allWatched = s.episodes.every(e => e.watched);
    const newVal = !allWatched;
    const seasons = x.seasons.map((ss,i) => {
      if (i !== si) return ss;
      return { ...ss, episodes: ss.episodes.map(ep => ({ ...ep, watched: newVal })) };
    });
    const total   = seasons.reduce((a,s)=>a+s.episodes.length,0);
    const watched = seasons.reduce((a,s)=>a+s.episodes.filter(e=>e.watched).length,0);
    const progress= total>0 ? Math.round(watched/total*100) : x.progress;
    const status = progress >= 100 ? 'completed' : (progress > 0 ? (x.type === 'movie' ? 'plan_to_watch' : 'watching') : 'plan_to_watch');
    const updated = { ...x, seasons, watchedEpisodes:watched, progress, status, updatedAt:new Date().toISOString() };
    const newItems = [...state.items];
    newItems[idx] = updated;
    state.items = newItems;
    renderPage();
    await api('PATCH', '/api/items/' + itemId, { seasons: updated.seasons, watchedEpisodes: watched, progress, status });
  } catch(e) {
    state.items[idx] = prev;
    renderPage();
    toast('Failed to update season: ' + e.message, 'err');
  }
}

async function deleteItem(id) {
  const item = state.items.find(x=>x.id===id);
  if (!await confirmModal(`Delete "${item?.title}" from your library?`)) return;
  try {
    state.items = state.items.filter(x=>x.id!==id);
    await api('DELETE', '/api/items/' + id);
    toast(`"${item?.title}" deleted!`, 'ok');
    navigate('library');
  } catch (e) {
    toast('Failed to delete: ' + e.message, 'err');
  }
}

async function saveEdit(id) {
  const item = state.items.find(x=>x.id===id);
  const patch = {};

  const titleEl = document.getElementById('e-title');
  const ratingEl = document.getElementById('e-rating');
  const yearEl = document.getElementById('e-year');
  const runtimeEl = document.getElementById('e-runtime');
  const languageEl = document.getElementById('e-language');
  const countryEl = document.getElementById('e-country');
  const genresEl = document.getElementById('e-genres');
  const posterEl = document.getElementById('e-poster');
  const bannerEl = document.getElementById('e-banner');
  const overviewEl = document.getElementById('e-overview');
  const commentEl = document.getElementById('e-comment');

  if (titleEl) patch.shared_title = titleEl.value || null;
  if (ratingEl) patch.shared_rating = parseFloat(ratingEl.value) || null;
  if (yearEl) patch.shared_year = parseInt(yearEl.value) || null;
  if (runtimeEl) patch.shared_runtime = parseInt(runtimeEl.value) || null;
  if (languageEl) patch.shared_language = languageEl.value || null;
  if (countryEl) patch.shared_country = countryEl.value || null;
  if (genresEl) patch.shared_genres = genresEl.value ? genresEl.value.split(',').map(s=>s.trim()).filter(Boolean) : [];

  if (posterEl) {
    if (!item.posterUrl) patch.shared_poster = posterEl.value || null;
    else patch.posterUrl = posterEl.value || null;
  }
  if (bannerEl) {
    if (!item.backdropUrl) patch.shared_backdrop = bannerEl.value || null;
    else patch.backdropUrl = bannerEl.value || null;
  }
  if (overviewEl) {
    if (!item.overview) patch.shared_overview = overviewEl.value || null;
    else patch.overview = overviewEl.value || null;
  }
  if (commentEl) {
    patch.comment = commentEl.value || null;
  }

  try {
    await api('PATCH', '/api/items/' + id, patch);
    const items = await api('GET', '/api/items');
    state.items = items;
    document.getElementById('edit-modal')?.remove();
    renderPage();
    toast('Changes saved!');
  } catch(e) {
    console.error(e);
    toast('Failed to save changes: ' + (e.message || 'Unknown error'));
  }
}

  let cur = 0;
  clearInterval(stepTimer);
  stepTimer = setInterval(() => { cur = Math.min(cur+1, STEPS.length-2); importStep=cur; renderPage(); }, 750);
  try {
    const data = await api('POST', '/api/items/import', { importUrl: importUrl });
    clearInterval(stepTimer);
    importStep = STEPS.length-1; renderPage();
    setTimeout(() => { importStep=-1; importPreview=data; renderPage(); }, 600);
  } catch (e) {
    clearInterval(stepTimer);
    importStep=-1; importErr=e.message||'Import failed';
  }
  renderPage();
}

async function saveImport() {
  if (!importPreview) return;
  const dupe = state.items.find(x => (importPreview.imdbId && x.imdbId===importPreview.imdbId)||(importPreview.tmdbId && x.tmdbId===importPreview.tmdbId));
  if (dupe) { toast(`"${importPreview.title}" is already in library!`,'err'); return; }
  const newItem = { ...importPreview, id:uid(), status:'plan_to_watch', progress:0, watchedEpisodes:0, rating:importPreview.rating||null, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
  try {
    await api('POST', '/api/items', newItem);
    state.items = [newItem, ...state.items];
    toast(`"${newItem.title}" added!`, 'ok');
    importPreview=null; importUrl='';
    navigate('detail', { detailId: newItem.id });
  } catch (e) {
    toast('Failed to save: ' + e.message, 'err');
  }
}

function toggleManualGenre(g) {
  const idx = manualForm.genres.indexOf(g);
  if (idx >= 0) manualForm.genres.splice(idx, 1); else manualForm.genres.push(g);
  renderPage();
}
function toggleEditGenre(btn, g) {
  const el = document.getElementById('e-genres');
  const arr = el.value ? el.value.split(',').map(s=>s.trim()).filter(Boolean) : [];
  const idx = arr.indexOf(g);
  if (idx >= 0) arr.splice(idx, 1); else arr.push(g);
  el.value = arr.join(', ');
  btn.style.background = idx >= 0 ? '' : 'var(--accent)';
  btn.style.color = idx >= 0 ? '' : '#fff';
  btn.style.borderColor = idx >= 0 ? '' : 'var(--accent)';
}

async function addToCollection(itemId, collName) {
  try {
    await api('PATCH', '/api/items/' + itemId, { collectionName: collName });
    state.items = state.items.map(x => x.id === itemId ? { ...x, collectionName: collName } : x);
    toast('Item added to collection');
    document.getElementById('coll-add-modal')?.remove();
    renderPage();
    openAddToCollectionModal(collName);
  } catch(e) { toast('Failed: ' + e.message, 'err'); }
}

function getCollections() {
  const map = {};
  state.items.forEach(x => {
    if (!x.collectionName) return;
    if (!map[x.collectionName]) map[x.collectionName] = { name: x.collectionName, items: [], description: '', bannerUrl: '' };
    map[x.collectionName].items.push(x);
  });
  state.collections.forEach(c => {
    if (!map[c.name]) map[c.name] = { name: c.name, items: [], description: c.description || '', bannerUrl: c.banner_url || c.bannerUrl || '', createdAt: c.createdAt };
    else { map[c.name].description = c.description || ''; map[c.name].bannerUrl = c.banner_url || c.bannerUrl || map[c.name].bannerUrl || ''; if (c.createdAt) map[c.name].createdAt = c.createdAt; }
  });
  return Object.values(map);
}

            <span>${c.items.length} Movie${c.items.length !== 1 ? 's' : ''}</span>

      <button class="btn btn-primary" onclick="saveNewCollection()">${ic('check')} Create Collection</button>
    </div>
  </div>`;
  el.onclick = () => el.remove();
  document.body.appendChild(el);
  setTimeout(() => document.getElementById('coll-name')?.focus(), 100);
}

async function saveNewCollection() {
  const name = document.getElementById('coll-name').value.trim();
  if (!name) { toast('Collection name is required', 'err'); return; }
  const existing = getCollections().find(c => c.name === name);
  if (existing) { toast('Collection already exists', 'err'); return; }
  const desc = document.getElementById('coll-desc').value.trim();
  const bannerUrl = document.getElementById('coll-banner')?.value?.trim() || '';
  document.getElementById('coll-modal')?.remove();
  await api('POST', '/api/collections', { name, description: desc, bannerUrl });
  await reloadAll();
  toast(`Collection "${name}" created!`);
}

function openEditCollModal(name) {
  const coll = getCollections().find(c => c.name === name);
  const el = document.createElement('div');
  el.className = 'modal-bg';
  el.id = 'coll-modal';
  el.innerHTML = `
  <div class="modal" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;margin-bottom:20px">
      <h2 style="font-weight:700;font-size:18px">${ic('edit')} Edit Collection</h2>
      <button onclick="document.getElementById('coll-modal').remove()" style="background:none;border:none;color:#9ca3af;cursor:pointer;font-size:20px">${ic('x')}</button>
    </div>
    <div class="input-group"><label>Collection Name</label><input class="input" id="coll-edit-name" value="${esc(name)}" placeholder="Enter collection name..."/></div>
    <div class="input-group" style="margin-top:12px"><label>Description</label><textarea class="input" id="coll-edit-desc" rows="3" placeholder="Write a brief description...">${esc(coll?.description || '')}</textarea></div>
    <div class="input-group" style="margin-top:12px"><label>Banner URL</label><input class="input" id="coll-edit-banner" type="url" value="${esc(coll?.bannerUrl || coll?.items?.find(x => x.backdropUrl)?.backdropUrl || '')}" placeholder="Paste banner image URL..."/></div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px">
      <button class="btn btn-ghost" onclick="document.getElementById('coll-modal').remove()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEditCollection('${esc(name)}')">${ic('check')} Save</button>
    </div>
  </div>`;
  el.onclick = () => el.remove();
  document.body.appendChild(el);
  document.getElementById('coll-edit-desc')?.focus();
}

async function saveEditCollection(oldName) {
  const newName = document.getElementById('coll-edit-name').value.trim();
  const desc = document.getElementById('coll-edit-desc').value.trim();
  const bannerUrl = document.getElementById('coll-edit-banner').value.trim() || null;
  if (!newName) { toast('Name is required', 'err'); return; }
  if (newName !== oldName) {
    await api('PUT', '/api/collections/' + encodeURIComponent(oldName), { newName });
  }
  await api('PUT', '/api/collections/' + encodeURIComponent(newName), { description: desc, bannerUrl });
  document.getElementById('coll-modal')?.remove();
  if (newName !== oldName) state.collectionDetailName = newName;
  await reloadAll();
  toast('Collection updated!');
}

async function deleteCollection(name) {
  if (!await confirmModal(`Delete collection "${name}"? Movies will not be removed from your library.`)) return;
  await api('DELETE', '/api/collections/' + encodeURIComponent(name));
  await reloadAll();
  navigate('collections');
  toast('Collection deleted!');
}

function toggleFaqEditMode() {
  state.faqEditMode = !state.faqEditMode;
  renderPage();
}

function toggleRule(id) {
  state.openRules = state.openRules || {};
  state.openRules[id] = !state.openRules[id];
  renderPage();
}

function toggleAddRule() {
  state.openRuleId = state.openRuleId === 'add' ? null : 'add';
  renderPage();
  if (state.openRuleId === 'add') {
    setTimeout(() => document.getElementById('rule-title')?.focus(), 50);
  }
}

async function addRule() {
  const title = document.getElementById('rule-title')?.value?.trim();
  const content = document.getElementById('rule-content')?.value?.trim() || '';
  if (!title) { toast('Title is required', 'err'); return; }
  await api('POST', '/api/rules', { title, content });
  state.rules = await api('GET', '/api/rules');
  state.openRuleId = null;
  renderPage();
  toast('Rule added!');
}

async function deleteRule(id, title) {
  if (!await confirmModal(`Delete rule "${title}"?`)) return;
  await api('DELETE', '/api/rules/' + id);
  state.rules = await api('GET', '/api/rules');
  renderPage();
  toast('Rule deleted!');
}

        ${u.google_id !== state.user?.google_id ? `<button class="btn btn-ghost" style="padding:6px;font-size:11px;color:${u.is_admin ? 'var(--warning)' : 'var(--accent)'}" onclick="event.stopPropagation();toggleUserAdmin('${esc(u.google_id)}', ${!u.is_admin}, '${esc(u.name || u.email)}')" title="${u.is_admin ? 'Demote' : 'Promote'}">${u.is_admin ? ic('user') : ic('crown')}</button>` : ''}
        ${u.google_id !== state.user?.google_id ? `<button class="btn btn-ghost" style="padding:6px;color:var(--danger)" onclick="event.stopPropagation();deleteUser('${esc(u.google_id)}', '${esc(u.name || u.email)}')" title="Delete user">${ic('trash')}</button>` : ''}
      </div>
    </div>`).join('')}

async function loadUsers() {
  try {
    state.usersList = await api('GET', '/api/users');
    const container = document.getElementById('users-list-container');
    if (container) container.innerHTML = renderUsersList();
  } catch {}
}

async function toggleUserAdmin(googleId, makeAdmin, name) {
  if (makeAdmin) {
    if (!await confirmModal(`Promote "${name}" to admin? You will be demoted to member.`)) return;
  } else {
    if (!await confirmModal(`Demote "${name}" from admin?`)) return;
  }
  try {
    const r = await api('PUT', '/api/users/' + googleId, { is_admin: makeAdmin });
    if (r.demoted_self) {
      state.isAdmin = false;
      const me = await api('GET', '/auth/me');
      state.user = me;
      state.isAdmin = !!me.is_admin;
    }
    await loadUsers();
    renderUserSidebar();
    renderNav();
    render();
    toast(makeAdmin ? `User "${name}" promoted to admin!` : `User "${name}" demoted to member.`);
  } catch (e) {
    toast('Failed: ' + e.message, 'err');
  }
}

async function deleteUser(googleId, name) {
  if (!await confirmModal(`Delete user "${name}"? Their data will be permanently removed.`)) return;
  try {
    await api('DELETE', '/api/users/' + googleId);
    await loadUsers();
    toast(`User "${name}" deleted.`);
  } catch (e) {
    toast('Failed: ' + e.message, 'err');
  }
}

async function saveKeys() {
  state.keys.tmdb = document.getElementById('sk-tmdb').value.trim() || state.keys.tmdb;

async function refreshData() {
  const btn = document.getElementById('refresh-btn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Refreshing...'; }
  try {
    const d = await api('POST', '/api/items/refresh');
    if (d.refreshed > 0) {
      await reloadAll();
      toast(`Refreshed! ${d.refreshed} item(s) updated.`, 'ok');
    } else {
      toast('All items are up to date!', 'ok');
    }
  } catch (e) {
    toast('Refresh failed: ' + e.message, 'err');
  }
  if (btn) { btn.disabled = false; btn.innerHTML = `${ic('refresh')} Refresh Now`; }
}

      <div id="lp-tint"></div>
      <div id="lp-content">
        <img id="lp-ticket" src="ticket.png" alt="Sign in" onclick="signInWithGoogle()"/>
        <div id="lp-logo">
          <img src="logo.gif" alt="Logo" id="lp-logo-gif"/>
          <span class="brand"><span class="movie">Movie</span><span class="sphere">Sphere</span></span>
        </div>
        <div id="lp-social">
          <div class="lp-social-wrap" data-label="Yeasin Arafat">
            <button class="lp-social-btn" aria-label="GitHub · Yeasin" onclick="onSocial('github-yeasin', this)">
              <svg viewBox="0 0 24 24"><path d="M12 .5C5.65.5.5 5.65.5 12a11.5 11.5 0 0 0 7.86 10.93c.58.1.79-.25.79-.56 0-.27-.01-1-.01-1.96-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.19a11.08 11.08 0 0 1 2.9-.39c.98 0 1.97.13 2.9.39 2.2-1.5 3.17-1.19 3.17-1.19.63 1.59.24 2.76.12 3.05.74.8 1.19 1.83 1.19 3.09 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.06.78 2.14 0 1.54-.01 2.79-.01 3.17 0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
            </button>
          </div>
          <div class="lp-social-wrap" data-label="Yeasin Arafat">
            <button class="lp-social-btn" aria-label="Email · Yeasin" onclick="onSocial('email-yeasin', this)">
              <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 2-8 5-8-5h16zm0 12H4V9l8 5 8-5v9z"/></svg>
            </button>
          </div>
          <div class="lp-social-wrap" data-label="Safwan Al Mahin">
            <button class="lp-social-btn" aria-label="GitHub · Safwan" onclick="onSocial('github-safwan', this)">
              <svg viewBox="0 0 24 24"><path d="M12 .5C5.65.5.5 5.65.5 12a11.5 11.5 0 0 0 7.86 10.93c.58.1.79-.25.79-.56 0-.27-.01-1-.01-1.96-3.2.7-3.88-1.54-3.88-1.54-.52-1.33-1.28-1.68-1.28-1.68-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.19a11.08 11.08 0 0 1 2.9-.39c.98 0 1.97.13 2.9.39 2.2-1.5 3.17-1.19 3.17-1.19.63 1.59.24 2.76.12 3.05.74.8 1.19 1.83 1.19 3.09 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.06.78 2.14 0 1.54-.01 2.79-.01 3.17 0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/></svg>
            </button>
          </div>
          <div class="lp-social-wrap" data-label="Safwan Al Mahin">
            <button class="lp-social-btn" aria-label="Email · Safwan" onclick="onSocial('email-safwan', this)">
              <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 2-8 5-8-5h16zm0 12H4V9l8 5 8-5v9z"/></svg>
            </button>
          </div>
        </div>
        <div id="lp-credit">
          <span class="credit-label">Created by</span>
          <div class="credit-name1">Yeasin Arafat</div>
          <div class="credit-name2">&amp; Safwan Al Mahin</div>
        </div>
        <div id="lp-hint">
          <div class="hint-line"></div>
          <span class="hint-text">Tap on the ticket to login and enjoy your movie journey</span>
          <div class="hint-line"></div>
        </div>
      </div>`;
    const lpTicket = document.getElementById('lp-ticket');
    if (lpTicket) {
      lpTicket.addEventListener('animationend', function () {
        this.style.animation = 'none';
        this.style.opacity = '1';
        this.classList.add('ready');
      });
      lpTicket.addEventListener('touchstart', function (e) {
        this.classList.add('touch-glow');
      }, { passive: true });
      lpTicket.addEventListener('touchend', function () {
        var self = this;
        self.classList.remove('touch-glow');
        self.blur();
      });
      lpTicket.addEventListener('touchcancel', function () {
        this.classList.remove('touch-glow');
        this.blur();
      });
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          lpTicket.classList.remove('touch-glow');
          lpTicket.blur();
        }
      });
    }
    const lpVideo = document.getElementById('lp-video');
    if (lpVideo) {
      let firstPlay = true;
      lpVideo.addEventListener('ended', () => {
        if (firstPlay) { firstPlay = false; }
        lpVideo.currentTime = 8.0;
        lpVideo.play();
      });
    }
    renderUserSidebar();
    return;
  }
  document.body.classList.remove('login-page');
  const oldLp = document.getElementById('lp-video');
  if (oldLp) oldLp.remove();
  const oldTint = document.getElementById('lp-tint');
  if (oldTint) oldTint.remove();
  const oldContent = document.getElementById('lp-content');
  if (oldContent) oldContent.remove();
  renderNav();
  renderUserSidebar();
  renderPage();
}

function renderNav() {
  const navEl = document.getElementById('nav');
  if (!navEl) return;
  navEl.innerHTML = NAV.map(n=>`
    <button class="nav-btn${state.page===n.id?' active':''}" onclick="navigate('${n.id}')">
      ${ic(n.icon)} ${n.label}
    </button>`).join('');
  document.getElementById('nav-settings').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg> Settings`;
  document.getElementById('nav-settings').className = 'nav-btn' + (state.page==='settings'?' active':'');
  document.getElementById('nav-rules').innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Rules &amp; Tips`;
  document.getElementById('nav-rules').className = 'nav-btn' + (state.page==='rules'?' active':'');
}

function renderPage() {
  const fn = RENDERERS[state.page] || renderDashboard;
  document.getElementById('page-root').innerHTML = fn();
}

async function boot() {
  state.loading = true;
  render();
  const params = new URLSearchParams(window.location.search);
  const tokenParam = params.get('token');
  if (tokenParam) {
    localStorage.setItem('token', tokenParam);
    window.history.replaceState({}, document.title, window.location.pathname);
  }
  const token = localStorage.getItem('token');
  if (token) {
    try {
      const me = await api('GET', '/auth/me');
      state.user = me;
      state.isAdmin = !!me.is_admin;
    } catch (e) {
      localStorage.removeItem('token');
      state.user = null;
      if (e.message === 'ACCOUNT_DELETED') {
        toast('Your account is no longer available. Sign in with Google to continue.', 'err');
      } else if (e.message === 'SESSION_EXPIRED') {
        toast('Your session has ended because this account is no longer active. Sign in with Google to continue.', 'err');
      }
    }
  }
  const hash = window.location.hash.replace('#','');
  if (hash.startsWith('detail/')) {
    state.page = 'detail'; state.detailId = decodeURIComponent(hash.slice(7));
  } else if (hash.startsWith('collection/')) {
    state.page = 'collection_detail'; state.collectionDetailName = decodeURIComponent(hash.slice(11));
  } else if (hash && RENDERERS[hash]) {
    state.page = hash;
  }
  if (state.user) {
    try {
      const [items, collections, rules] = await Promise.all([
        api('GET', '/api/items'),
        api('GET', '/api/collections'),
        api('GET', '/api/rules').catch(() => []),
      ]);
      let keys = { tmdb: '', omdb: '' };
      try { keys = await api('GET', '/api/keys'); } catch {}
      state.items = items;
      state.collections = collections;
      state.keys = keys;
      state.rules = rules || [];
      if (state.isAdmin) loadUsers();
    } catch (e) {
      toast('Failed to load data: ' + e.message, 'err');
    }
    state.loading = false;
    render();
    api('POST', '/api/items/refresh').catch(() => {});
    setInterval(async () => {
      if (!state.user) return;
      try {
        await api('GET', '/auth/me');
      } catch (e) {
        logout();
        if (e.message === 'ACCOUNT_DELETED') {
          await alertModal('This account has been removed and is no longer available. You\'ll be signed out now. Sign in with Google to continue.');
        } else {
          await alertModal('Your session has ended because this account is no longer active. Sign in with Google to continue.');
        }
      }
    }, 60 * 1000);
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && state.user) {
        try {
          await api('GET', '/auth/me');
        } catch (e) {
          logout();
          if (e.message === 'ACCOUNT_DELETED') {
            await alertModal('This account has been removed and is no longer available. You\'ll be signed out now. Sign in with Google to continue.');
          } else {
            await alertModal('Your session has ended because this account is no longer active. Sign in with Google to continue.');
          }
        }
      }
    });
  } else {
    state.loading = false;
    render();
  }
}

boot();

// Handle mobile back button
window.addEventListener('popstate', function() {
  if (!state.user) return;
  const oldPage = state.page;
  const hash = window.location.hash.replace('#','');
  if (hash.startsWith('detail/')) {
    state.page = 'detail'; state.detailId = decodeURIComponent(hash.slice(7));
  } else if (hash.startsWith('collection/')) {
    state.page = 'collection_detail'; state.collectionDetailName = decodeURIComponent(hash.slice(11));
  } else if (hash && RENDERERS[hash]) {
    state.page = hash;
  }
  if (state.page !== oldPage) render();
});
window.addEventListener('hashchange', function() {
  if (!state.user) return;
  const oldPage = state.page;
  const hash = window.location.hash.replace('#','');
  if (hash.startsWith('detail/')) {
    state.page = 'detail'; state.detailId = decodeURIComponent(hash.slice(7));
  } else if (hash.startsWith('collection/')) {
    state.page = 'collection_detail'; state.collectionDetailName = decodeURIComponent(hash.slice(11));
  } else if (hash && RENDERERS[hash]) {
    state.page = hash;
  }
  if (state.page !== oldPage) render();
});

new MutationObserver(() => {
  document.body.style.overflow = document.querySelector('.modal-bg') ? 'hidden' : '';
}).observe(document.body, { childList: true });

</script>
